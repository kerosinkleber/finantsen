name: CI
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finantsen
          POSTGRES_PASSWORD: finantsen
          POSTGRES_DB: finantsen_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finantsen" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://finantsen:finantsen@localhost:5432/finantsen_test
      DATABASE_URL: postgres://finantsen:finantsen@localhost:5432/finantsen_test
      E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/ci.sh
