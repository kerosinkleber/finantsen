# Lokaler Test ohne Domain/HTTPS/.env:
#   docker compose -f docker-compose.local.yml up --build
# Danach: http://localhost:3000 (Port änderbar: LOCAL_PORT=3001 docker compose -f ... up --build)
# Aufräumen inkl. Daten: docker compose -f docker-compose.local.yml down -v
# Mails (Einmal-Links, Passwort vergessen, Benachrichtigungen) landen im lokalen Postfach Mailpit:
#   http://localhost:8025 (Port änderbar: LOCAL_MAIL_PORT=8026). Nichts verlässt den Rechner.
name: finantsen-local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finantsen
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: finantsen
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finantsen -d finantsen"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Lokales Test-Postfach (MIT-Lizenz): fängt alle Mails ab und zeigt sie im Browser an
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "${LOCAL_MAIL_PORT:-8025}:8025"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "${LOCAL_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://finantsen:local-dev-only@db:5432/finantsen
      APP_URL: http://localhost:${LOCAL_PORT:-3000}
      DEFAULT_LOCALE: de
      # Fester Schlüssel NUR für lokale Tests (verschlüsselt TOTP-Geheimnisse); produktiv ein eigener, zufälliger Wert
      APP_SECRET: local-dev-only-app-secret-change-for-release
      # Nur für den lokalen Test: Admin-Testfunktionen standardmäßig an (im produktiven Stack nicht gesetzt = aus)
      TEST_FEATURES_DEFAULT: "true"
      # Nur lokaler Test: Admin "admin" ohne Passwort wird angelegt, Anmeldung per Knopf (keine Ersteinrichtung nötig).
      # Der produktive Stack setzt DEV_ADMIN nie.
      DEV_ADMIN: "true"
      # Optional: aus der Shell durchreichen, z. B. ANTHROPIC_API_KEY=sk-... docker compose -f ... up
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Mailversand an Mailpit. Mit SMTP_URL= (leer) aus der Shell ist er aus und lässt sich im Admin-Bereich
      # einrichten (Server "mailpit", Port 1025, Verschlüsselung "Keine").
      SMTP_URL: ${SMTP_URL-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-Finantsen lokal <finantsen@localhost>}
      EXCHANGE_RATE_PROVIDER: ${EXCHANGE_RATE_PROVIDER:-fawazahmed0}
      EXCHANGE_RATES_STATIC: ${EXCHANGE_RATES_STATIC:-}

volumes:
  db-data:
