# Finantsen auf einem NAS oder Heimserver: fertiges Image von GitHub, ohne Bauen, ohne eigene Domain.
# Anleitung: docs/anleitung-nas.md
#
#   docker compose -f docker-compose.nas.yml pull
#   docker compose -f docker-compose.nas.yml up -d
#
# Danach: http://<IP-des-NAS>:<APP_PORT> (Standard 3000). Werte kommen aus der Datei .env im selben Ordner.
# Hinweis: Über http:// gehen Kamera-Scanner, Passkeys, App-Installation, Offline und Push nicht (Browser verlangen
# HTTPS). Zum Ausprobieren reicht das; für den Dauerbetrieb siehe Fragebogen 9 (HTTPS im Heimnetz).
name: finantsen

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finantsen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bitte POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: finantsen
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finantsen -d finantsen"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ghcr.io/kerosinkleber/finantsen:${FINANTSEN_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://finantsen:${POSTGRES_PASSWORD}@db:5432/finantsen
      # Adresse, unter der du die App im Browser öffnest (für Links in Mails und Einladungen)
      APP_URL: ${APP_URL:?Bitte APP_URL in .env setzen, z. B. http://192.168.178.20:3000}
      APP_SECRET: ${APP_SECRET:?APP_SECRET fehlt in .env (mindestens 16 Zeichen, zufällig)}
      # Speicher-Obergrenze für Node (siehe Dockerfile, docs/performance.md); in der .env änderbar
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=256}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-de}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      EXCHANGE_RATE_PROVIDER: ${EXCHANGE_RATE_PROVIDER:-fawazahmed0}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

volumes:
  db-data:
